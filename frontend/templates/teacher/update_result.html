<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Result</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn {
            background: #198754;
            color: white;
        }

        .back-btn {
            background: #ddd;
            color: #333;
            text-decoration: none;
            display: inline-block;
            margin-left: 10px;
        }

        .error {
            background: #ffe0e0;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <header class="header">

        <h1>Student Result Portal</h1>

    </header>


    <div class="container">

        <div class="form-card">

            <h2>Update Student Result</h2>

            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <div class="form-group">

                    <label for="student">
                        Student
                    </label>

                    <select
                        id="student"
                        name="student"
                        required>

                        {% for student in students %}

                            <option
                                value="{{ student.id }}"
                                {% if student.id == result.student.id %}
                                    selected
                                {% endif %}>

                                {{ student.roll_number }}
                                -
                                {{ student.full_name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <select
                        id="subject"
                        name="subject"
                        required>

                        {% for subject in subjects %}

                            <option
                                value="{{ subject.id }}"
                                {% if subject.id == result.subject.id %}
                                    selected
                                {% endif %}>

                                {{ subject.subject_code }}
                                -
                                {{ subject.subject_name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="exam">
                        Exam
                    </label>

                    <select
                        id="exam"
                        name="exam"
                        required>

                        {% for exam in exams %}

                            <option
                                value="{{ exam.id }}"
                                {% if exam.id == result.exam.id %}
                                    selected
                                {% endif %}>

                                {{ exam.exam_name }}
                                -
                                {{ exam.academic_year }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="marks">
                        Marks Obtained
                    </label>

                    <input
                        type="number"
                        id="marks"
                        name="marks"
                        value="{{ result.marks }}"
                        step="0.01"
                        min="0"
                        required>

                </div>


                <div class="form-group">

                    <label for="max_marks">
                        Maximum Marks
                    </label>

                    <input
                        type="number"
                        id="max_marks"
                        name="max_marks"
                        value="{{ result.max_marks }}"
                        step="0.01"
                        min="1"
                        required>

                </div>


                <div class="form-group">

                    <label for="remarks">
                        Remarks
                    </label>

                    <textarea
                        id="remarks"
                        name="remarks">{{ result.remarks }}</textarea>

                </div>


                <button
                    type="submit"
                    class="btn update-btn">

                    Update Result

                </button>


                <a
                    href="{% url 'view_results' %}"
                    class="btn back-btn">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</body>

</html>
